services:
  vins-d435i:
    container_name: vins_d435i_compose
    image: vins-fusion-d435i-local:compose
    user: air
    # dialout: serial ports for MAVROS (/dev/ttyUSB*, /dev/ttyACM*, /dev/ttyTHS*).
    group_add:
      - dialout
      - plugdev
      - video
    environment:
      HOME: /home/air
      USER: air
      LD_LIBRARY_PATH: /home/air/vins_fusion_d435i_local/third_party/librealsense/build/Release:/home/air/vins_fusion_d435i_local/rs_ros_ws/devel/lib:/opt/librealsense/lib:/opt/ros/noetic/lib
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /home/air/vins_fusion_d435i_local
    volumes:
      - .:/home/air/vins_fusion_d435i_local
      # Persist the librealsense install (built from third_party/librealsense) across container re-creation.
      - ./third_party/librealsense/install:/opt/librealsense
      - /dev:/dev
      - /run/udev:/run/udev:ro
